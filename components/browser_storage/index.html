<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
// Zero-height bridge between Streamlit and the browser's localStorage.
//
// Streamlit's session state lives on the server and is discarded when the page
// is reloaded, so conversation history is mirrored into localStorage here and
// read back on load. Implements the component postMessage protocol directly so
// the app needs no npm build step and no third-party dependency.

// The key is supplied per instance so one component can back several stores
// (chat history, session token). Falls back to the chat key for safety.
let STORAGE_KEY = "nykaa_discovery_chat_history_v1";

function send(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra), "*");
}

function setValue(value) {
  send("streamlit:setComponentValue", { value: value, dataType: "json" });
}

function readStored() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    // Private mode, disabled site data, or corrupt JSON: behave as if empty.
    return null;
  }
}

function writeStored(value) {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

let reported = false;

window.addEventListener("message", function (event) {
  if (!event.data || event.data.type !== "streamlit:render") return;

  const args = event.data.args || {};
  if (args.storage_key) STORAGE_KEY = args.storage_key;

  if (args.action === "save" && args.value !== null && args.value !== undefined) {
    writeStored(args.value);
  } else if (args.action === "clear") {
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  // Report the stored history exactly once per page load. Returning a new value
  // on every render would retrigger a Streamlit rerun and loop forever.
  if (!reported) {
    reported = true;
    setValue({ loaded: true, value: readStored() });
  }
});

send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
